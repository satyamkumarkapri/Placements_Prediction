<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Placement Analytics AI{% endblock %}</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-graduation-cap logo-icon"></i>
                <h2>Placement AI</h2>
            </div>
            
            <nav class="sidebar-nav">
                <a href="{{ url_for('index') }}" class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
                <a href="{{ url_for('load_page') }}" class="nav-item {% if request.endpoint == 'load_page' %}active{% endif %}">
                    <i class="fa-solid fa-database"></i>
                    <span>Load Data</span>
                </a>
                <a href="{{ url_for('eda_page') }}" class="nav-item {% if request.endpoint == 'eda_page' %}active{% endif %}">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>EDA Report</span>
                </a>
                <a href="{{ url_for('feature_engg_page') }}" class="nav-item {% if request.endpoint == 'feature_engg_page' %}active{% endif %}">
                    <i class="fa-solid fa-laptop-code"></i>
                    <span>Feature Engg</span>
                </a>
                <a href="{{ url_for('predict_page') }}" class="nav-item {% if request.endpoint == 'predict_page' %}active{% endif %}">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span style="color: #38bdf8; font-weight: 600;">Predict Placement</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <p>ML Project v1.0</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Navbar -->
            <header class="topbar">
                <div class="topbar-left">
                    <h1>{% block page_title %}Overview{% endblock %}</h1>
                </div>
                <div class="topbar-right">
                    <span class="dataset-badge"><i class="fa-solid fa-file-csv"></i> 50k_Dataset.csv</span>
                    <div class="user-profile">
                        <i class="fa-solid fa-circle-user"></i> Admin
                    </div>
                </div>
            </header>

            <!-- Dynamic Content -->
            <div class="content-wrapper">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
